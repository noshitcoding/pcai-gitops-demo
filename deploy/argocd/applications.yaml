# Applied once in the external Argo CD (namespace argocd), after appproject.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smoke
  namespace: argocd
spec:
  project: pcai-gitops-demo
  source:
    repoURL: https://github.com/noshitcoding/pcai-gitops-demo.git
    targetRevision: main
    path: deploy/smoke
  destination:
    name: pcai3
    namespace: project-gitops-demo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlis-model
  namespace: argocd
spec:
  project: pcai-gitops-demo
  source:
    repoURL: https://github.com/noshitcoding/pcai-gitops-demo.git
    targetRevision: main
    path: deploy/mlis-model
  destination:
    name: pcai3
    namespace: project-gitops-demo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 3
      backoff: {duration: 2m, factor: 2, maxDuration: 20m}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatbot-framework
  namespace: argocd
spec:
  project: pcai-gitops-demo
  source:
    repoURL: https://github.com/noshitcoding/pcai-gitops-demo.git
    targetRevision: main
    path: deploy/chatbot-framework
  destination:
    name: pcai3
    namespace: project-gitops-demo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
