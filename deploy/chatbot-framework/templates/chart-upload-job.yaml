# Puts the chart into the AIE chart museum before the EzAppConfig refers to it.
apiVersion: batch/v1
kind: Job
metadata:
  name: chart-upload
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chart-upload
        # Keep the public CA bundle: the job downloads from github.com.
        add-ezua-domain-ca-cert: "false"
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: upload
          image: curlimages/curl:8.10.1
          env:
            - {name: NAME, value: {{ .Values.chart.name | quote }}}
            - {name: VERSION, value: {{ .Values.chart.version | quote }}}
            - {name: RELEASES, value: {{ .Values.chart.releaseUrl | quote }}}
            - {name: MUSEUM, value: {{ .Values.chart.museum | quote }}}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cd /tmp
              if curl -fsS "$MUSEUM/api/charts/$NAME/$VERSION" >/dev/null 2>&1; then
                echo "chart $NAME $VERSION is already in the chart museum"; exit 0
              fi
              curl -fsSL -o chart.tgz "$RELEASES/$NAME-$VERSION/$NAME-$VERSION.tgz"
              curl -fsS --data-binary @chart.tgz "$MUSEUM/api/charts"
              echo; echo "uploaded $NAME $VERSION"
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
