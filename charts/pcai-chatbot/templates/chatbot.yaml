apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  MLIS_URL: {{ .Values.mlis.url | quote }}
  MLIS_PROJECT: {{ .Values.mlis.project | quote }}
  MLIS_DEPLOYMENT: {{ .Values.mlis.deployment | quote }}
  TOKEN_NAMESPACE: {{ .Values.aieToken.namespace | quote }}
  TOKEN_SECRET: {{ .Values.aieToken.secret | quote }}
  {{- if .Values.modelToken.secret }}
  MODEL_TOKEN_FILE: /var/run/secrets/model-api/token
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "hpe-ezua.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pcai-chatbot.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "hpe-ezua.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pcai-chatbot.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pcai-chatbot.selector" . | nindent 8 }}
        {{- include "hpe-ezua.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: chatbot
          # AIE forces imagePullPolicy IfNotPresent: publish every change under a new tag.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 7860
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          {{- if .Values.modelToken.secret }}
          volumeMounts:
            - name: model-api-token
              mountPath: /var/run/secrets/model-api
              readOnly: true
          {{- end }}
      {{- if .Values.modelToken.secret }}
      volumes:
        # API token of the model endpoint, generated by an administrator in AIE.
        # Optional: without it the app falls back to the AIE token of the technical user.
        - name: model-api-token
          secret:
            secretName: {{ .Values.modelToken.secret }}
            optional: true
      {{- end }}
