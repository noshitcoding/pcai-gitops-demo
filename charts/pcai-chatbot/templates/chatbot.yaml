apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccountName }}
---
# Read access to the one InferenceService of the model: no AIE user token needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-read-model
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    resourceNames: [{{ .Values.model.deployment | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-read-model
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-read-model
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  MLIS_DEPLOYMENT: {{ .Values.model.deployment | quote }}
  {{- if .Values.model.endpoint }}
  MODEL_ENDPOINT: {{ .Values.model.endpoint | quote }}
  {{- end }}
  TLS_VERIFY: {{ .Values.tls.verify | toString | quote }}
  MODEL_TOKEN_FILE: /var/run/secrets/model-api/token
  TOKEN_WARN_DAYS: {{ .Values.modelToken.warnDays | toString | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "hpe-ezua.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pcai-chatbot.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "hpe-ezua.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pcai-chatbot.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pcai-chatbot.selector" . | nindent 8 }}
        {{- include "hpe-ezua.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: chatbot
          # Nodes keep pulled images: publish every change under a new tag.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 7860
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: model-api-token
              mountPath: /var/run/secrets/model-api
              readOnly: true
      volumes:
        # API token of the model endpoint, generated by an administrator in AIE.
        # Optional, so that the app starts and shows what is missing.
        - name: model-api-token
          secret:
            secretName: {{ .Values.modelToken.secret }}
            optional: true
