image:
  repository: ghcr.io/noshitcoding/pcai-chatbot
  tag: "0.2.0"

# Fixed name: the app reads the InferenceService of the model with this account.
serviceAccountName: chatbot

service:
  port: 80

# MLIS deployment (= KServe InferenceService in this namespace) that serves the model.
model:
  deployment: qwen3-8b-chat
  # Optional fixed endpoint URL; empty: read status.url of the InferenceService.
  endpoint: ""

# Secret with key "token": API token of the model endpoint (AIE: Model Endpoints >
# Generate API Token). Created by the provider, never stored in Git.
modelToken:
  secret: model-api-token
  # The status line warns this many days before the token expires.
  warnDays: 30

# Demo: PCAI uses self-signed certificates, so TLS is not verified. Set true in production.
tls:
  verify: false

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1Gi}

# Platform options read by AI Essentials (see "Preparing the Framework Helm Chart")
ezua:
  virtualService:
    endpoint: "chatbot.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
  authorizationPolicy:
    namespace: "istio-system"
    providerName: "oauth2-proxy"
    matchLabels:
      istio: "ingressgateway"
