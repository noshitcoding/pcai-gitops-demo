name: release
on:
  push:
    branches: [main]
    paths: ["chatbot/**", "charts/**", ".github/workflows/release.yaml"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read image version
        run: echo "VERSION=$(tr -d '[:space:]' < chatbot/VERSION)" >> "$GITHUB_ENV"
      - name: Skip if the tag exists
        id: check
        run: |
          if docker manifest inspect "ghcr.io/${{ github.repository_owner }}/pcai-chatbot:$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: steps.check.outputs.exists != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists != 'true'
        with:
          context: chatbot
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pcai-chatbot:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and publish the chart as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(awk '/^version:/ {print $2}' charts/pcai-chatbot/Chart.yaml)
          TAG="pcai-chatbot-$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; raise the chart version to publish a change"; exit 0
          fi
          helm lint charts/pcai-chatbot
          helm package charts/pcai-chatbot -d dist
          gh release create "$TAG" "dist/$TAG.tgz" --title "$TAG" --notes "Helm chart for the AIE framework import"
